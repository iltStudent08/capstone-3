services:
  mongo:
    image: mongo:7
    container_name: pct-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  api:
    build: ./capstone-api
    container_name: pct-api
    ports:
      - "4000:4000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy-claims
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "4000"
    depends_on:
      - mongo
    restart: unless-stopped

  client:
    build: ./capstone-client
    container_name: pct-client
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
